<!-- ==========================================================================
     BLOC 01 — HERO D'ACCUEIL
     --------------------------------------------------------------------------
     Ou le coller : Content Layout Macro > + Add Module > HTML Module
     Remplace le module "Navigation Highlight" actuel.
     Prerequis  : space-stylesheet.css installe dans Space tools >
                  Look and Feel > Stylesheet
     --------------------------------------------------------------------------
     A PERSONNALISER : les valeurs marquees {{ }} et les href="#".
     ========================================================================== -->

<div class="jls">
  <header class="jls-hero">
    <div class="jls-hero__inner">

      <div class="jls-hero__main">
        <p class="jls-hero__eyebrow">Space Transportation</p>

        <h1 class="jls-hero__title">
          JLS &ndash; <em>Program Management Office</em>
        </h1>

        <p class="jls-hero__lead">
          Espace de pilotage de l&rsquo;equipe de support au management des
          programmes de transport spatial : gouvernance, jalons, points focaux
          et synthese multi-programmes.
        </p>

      </div>

      <!-- Colonne de droite : CTA en grand format + carte "responsable".
           `jls-btn--xl` occupe toute la largeur de la colonne, la aside
           garde la meme largeur en-dessous. -->
      <div class="jls-hero__rail">
        <a class="jls-btn jls-btn--primary jls-btn--xl" href="#">
          JLS Internal Portal
          <span class="jls-btn__arrow" aria-hidden="true">&rarr;</span>
        </a>

        <aside class="jls-hero__aside">
          <p class="jls-hero__aside-label">Head of PMO</p>
          <div class="jls-node__meta">
            <span class="jls-avatar jls-avatar--accent jls-avatar--lg" aria-hidden="true">NN</span>
            <div>
              <p style="margin:0;font-weight:650;color:#fff;">{{Prenom Nom}}</p>
              <p style="margin:0;font-size:12px;color:rgba(233,237,244,.6);">JLS PMO</p>
            </div>
          </div>
        </aside>
      </div>

    </div>
  </header>
</div>
